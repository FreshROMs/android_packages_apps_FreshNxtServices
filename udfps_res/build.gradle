plugins {
    id 'com.android.application'
    id 'com.hyperdevs.poeditor'
}

android {
    compileSdk 34

    defaultConfig {
        applicationId "cf.tenseventyseven.fresh.udfps.res"
        minSdk 34
        //noinspection OldTargetApi
        targetSdk 34
        versionCode 25060401
        versionName "15.0.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'cf.tenseventyseven.fresh.udfps.res'
}

// POEditor Config
if (file('../../udfps.gradle').exists()) {
    apply from: '../../udfps.gradle'
}
